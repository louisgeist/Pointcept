name: malibu3d
channels:
  - nvidia/label/cuda-12.4.1
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy<2  # KPConvX C++ wrappers use the numpy 1.x C API
  - cuda-toolkit=12.4  # nvcc and headers to build the CUDA extensions (README, Installation)
  - gcc=13
  - gxx=13
  - ninja
  - pyyaml
  - tensorboard
  - tensorboardx
  - wandb
  - yapf
  - addict
  - easydict  # KPConvX
  - scipy
  - termcolor
  - regex
  - tqdm
  - matplotlib
  - black
  - pytest
  - huggingface_hub  # dataset and checkpoint downloads
  - plyfile  # DALES preprocessing
  - laspy  # H3D / ECLAIR / OpenGF / PureForest preprocessing
  - lazrs-python
  - geopandas  # MALiBU3D road graphs (rasterize_network.py, APLS)
  - gdal  # predicted road graphs written as GeoPackage
  - scikit-image  # road mask skeletonization (network_graph_pipeline.py)
  - scikit-learn  # PureForest linear probe (tools/probe_pureforest.py)
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - --find-links https://data.pyg.org/whl/torch-2.5.0+cu124.html
    - torch==2.5.0
    - torchvision==0.20.0
    - timm
    - torch-scatter
    - torch-cluster  # used by torch_geometric's voxel_grid (KPConvX)
    - torch_geometric==2.7.0  # KPConvX; 2.8 needs pyg-lib for voxel_grid
    - spconv-cu124
