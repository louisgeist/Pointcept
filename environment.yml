name: malibu3d
channels:
  - pytorch
  - nvidia/label/cuda-12.4.4
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cuda
  - conda-forge::cudnn
  - gcc=13.2
  - gxx=13.2
  - pytorch=2.5.0
  - torchvision=0.20.0
  - torchaudio=2.5.0
  - pytorch-cuda=12.4
  - ninja
  - pyyaml
  - tensorboard
  - tensorboardx
  - wandb
  - yapf
  - addict
  - scipy
  - termcolor
  - timm
  - regex
  - tqdm
  - matplotlib
  - black
  - huggingface_hub  # dataset and checkpoint downloads
  - plyfile  # DALES preprocessing
  - laspy  # H3D / ECLAIR / OpenGF / PureForest preprocessing
  - lazrs-python
  - geopandas  # MALiBU3D road graphs (rasterize_network.py, APLS)
  - gdal  # predicted road graphs written as GeoPackage
  - scikit-image  # road mask skeletonization (network_graph_pipeline.py)
  - scikit-learn  # PureForest linear probe (tools/probe_pureforest.py)
  - pip:
    - torch-scatter -f https://data.pyg.org/whl/torch-2.5.0+cu124.html
    - torch_geometric  # KPConvX
    - spconv-cu124
    - git+https://github.com/Dao-AILab/flash-attention.git
    - ./libs/pointops  # KPConvX neighbor search
    - ./libs/pointrope  # LitePT rotary embeddings
